<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade 8 Bukaneg Student Coding Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }


        /* =====================================================
           LOGIN / WELCOME SCREEN
        ===================================================== */

        #loginScreen {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5,
                #6d28d9
            );

            padding: 20px;
        }


        .login-card {
            width: 690px;
            max-width: 100%;

            min-height: 715px;

            background: white;

            border-radius: 30px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 85px 50px 60px;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.20);

            text-align: center;
        }


        /* LAPTOP ICON */

        .laptop-icon {
            font-size: 75px;
            line-height: 1;

            margin-bottom: 45px;
        }


        /* MAIN TITLE */

        .login-title {
            margin: 0;

            font-size: 50px;
            font-weight: bold;

            color: #2864d7;
        }


        /* SUBTITLE */

        .login-subtitle {
            margin-top: 20px;
            margin-bottom: 34px;

            font-size: 31px;
            font-weight: bold;

            color: #7135d9;
        }


        /* DESCRIPTION */

        .login-description {
            margin: 0;

            color: #555;

            font-size: 20px;

            line-height: 1.8;
        }


        /* NAME INPUT */

        .name-input {
            width: 100%;

            margin-top: 32px;

            padding: 20px;

            border: 2px solid #ddd;
            border-radius: 12px;

            font-size: 19px;

            color: #333;

            outline: none;

            transition: 0.2s;
        }


        .name-input:focus {
            border-color: #3474df;

            box-shadow:
                0 0 0 3px rgba(52, 116, 223, 0.12);
        }


        .name-input::placeholder {
            color: #888;
        }


        /* ENTER BUTTON */

        .enter-button {
            width: 100%;

            margin-top: 18px;

            padding: 19px;

            border: none;
            border-radius: 11px;

            background: #2864df;

            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        .enter-button:hover {
            background: #1f55c4;
        }


        .enter-button:active {
            transform: scale(0.99);
        }


        /* LOGIN ERROR */

        .login-message {
            min-height: 20px;

            margin-top: 12px;

            color: #d33;

            font-size: 14px;
        }



        /* =====================================================
           CODING STUDIO
        ===================================================== */

        #codingStudio {
            display: none;

            width: 100%;
            height: 100vh;

            background: #1e1e1e;

            color: white;

            font-family: Arial, sans-serif;
        }


        /* TOP */

        .top {
            height: 40px;

            background: #181818;

            display: flex;
            align-items: center;

            padding-left: 15px;
        }


        .title {
            font-weight: bold;

            margin-right: 30px;
        }


        .subtitle {
            color: #aaa;

            font-size: 14px;
        }


        /* STUDENT NAME */

        .student-name {
            margin-left: auto;

            margin-right: 15px;

            color: #888;

            font-size: 12px;
        }


        .student-name span {
            color: white;

            font-weight: bold;
        }


        /* TABS */

        .tabs {
            height: 40px;

            background: #252526;

            display: flex;
        }


        .tab {
            padding: 12px 25px;

            color: #aaa;

            border-right: 1px solid #333;

            cursor: pointer;

            font-size: 13px;
        }


        .tab:hover {
            color: white;
        }


        .tab.active {
            color: white;

            background: #1e1e1e;

            border-top: 2px solid #007acc;
        }



        /* MAIN */

        .main {
            display: flex;

            height: calc(100vh - 80px);
        }



        /* EDITOR */

        .editor {
            width: 54%;

            display: flex;

            flex-direction: column;
        }


        .code-area {
            flex: 1;

            display: flex;

            overflow: hidden;
        }


        /* LINE NUMBERS */

        .numbers {
            width: 55px;

            padding-top: 15px;
            padding-right: 15px;

            text-align: right;

            color: #777;

            font-family: monospace;

            font-size: 14px;

            line-height: 22px;

            overflow: hidden;
        }


        /* CODE TEXTAREA */

        textarea {
            flex: 1;

            border: none;

            outline: none;

            resize: none;

            background: #1e1e1e;

            color: #d4d4d4;

            font-family: Consolas, monospace;

            font-size: 14px;

            padding: 15px 10px;

            line-height: 22px;
        }


        textarea::placeholder {
            color: #666;
        }



        /* =====================================================
           PREVIEW
        ===================================================== */

        .preview {
            width: 46%;

            background: white;

            border-left: 1px solid #333;
        }


        .preview-title {
            height: 40px;

            background: #252526;

            color: white;

            padding: 12px 15px;

            font-size: 13px;
        }


        iframe {
            width: 100%;

            height: calc(100% - 40px);

            border: none;

            background: white;
        }



        /* =====================================================
           BOTTOM BUTTON AREA
        ===================================================== */

        .bottom {
            height: 45px;

            background: #181818;

            border-top: 1px solid #333;

            display: flex;

            align-items: center;

            padding: 5px 15px;
        }


        button {
            border: none;

            padding: 8px 18px;

            border-radius: 4px;

            cursor: pointer;

            margin-right: 8px;

            font-size: 13px;
        }


        /* RUN */

        .run {
            background: #0e8a3e;

            color: white;
        }


        .run:hover {
            background: #0b6f32;
        }


        /* CLEAR */

        .clear {
            background: #444;

            color: white;
        }


        .clear:hover {
            background: #555;
        }


        /* STATUS */

        .status {
            margin-left: auto;

            color: #888;

            font-size: 12px;
        }



        /* =====================================================
           RESPONSIVE LOGIN
        ===================================================== */

        @media (max-width: 700px) {

            .login-card {
                min-height: auto;

                padding: 55px 30px 45px;

                border-radius: 25px;
            }


            .laptop-icon {
                font-size: 60px;

                margin-bottom: 30px;
            }


            .login-title {
                font-size: 36px;
            }


            .login-subtitle {
                font-size: 24px;
            }


            .login-description {
                font-size: 16px;
            }


            .main {
                flex-direction: column;
            }


            .editor,
            .preview {
                width: 100%;
            }


            .editor {
                height: 55%;
            }


            .preview {
                height: 45%;
            }


            .tab {
                padding: 12px 10px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         LOGIN / WELCOME SCREEN
    ===================================================== -->

    <section id="loginScreen">

        <div class="login-card">


            <!-- Laptop -->

            <div class="laptop-icon">
                💻
            </div>


            <!-- Title -->

            <h1 class="login-title">
                Grade 8 Bukaneg
            </h1>


            <!-- Subtitle -->

            <h2 class="login-subtitle">
                Student Coding Portal
            </h2>


            <!-- Description -->

            <p class="login-description">
                Welcome to your interactive website coding classroom!<br>

                Enter your name to begin learning HTML, CSS, and JavaScript.
            </p>


            <!-- Name Input -->

            <input
                type="text"
                id="studentInput"
                class="name-input"
                placeholder="Enter your name"
                autocomplete="off"
            >


            <!-- Enter Button -->

            <button
                class="enter-button"
                onclick="enterPortal()"
            >
                Enter Coding Portal 🚀
            </button>


            <!-- Error Message -->

            <div
                id="loginMessage"
                class="login-message"
            ></div>


        </div>

    </section>



    <!-- =====================================================
         CODING STUDIO
    ===================================================== -->

    <section id="codingStudio">


        <!-- TOP BAR -->

        <div class="top">

            <div class="title">
                Coding Studio
            </div>

            <div class="subtitle">
                Student Code Editor
            </div>


            <!-- Student Name -->

            <div class="student-name">

                Student:

                <span id="displayStudentName">
                    Student
                </span>

            </div>

        </div>



        <!-- =================================================
             FILE TABS
        ================================================== -->

        <div class="tabs">


            <div
                class="tab active"
                onclick="openTab('html', this)"
            >
                index.html
            </div>


            <div
                class="tab"
                onclick="openTab('css', this)"
            >
                style.css
            </div>


            <div
                class="tab"
                onclick="openTab('js', this)"
            >
                script.js
            </div>


        </div>



        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <div class="main">


            <!-- =================================================
                 CODE EDITOR
            ================================================== -->

            <div class="editor">


                <div class="code-area">


                    <!-- LINE NUMBERS -->

                    <div
                        class="numbers"
                        id="numbers"
                    >
                        1
                    </div>


                    <!-- CODE BOX -->

                    <textarea
                        id="code"
                        spellcheck="false"
                        placeholder="Start writing your code here..."
                    ></textarea>


                </div>



                <!-- =================================================
                     BOTTOM BUTTONS
                ================================================== -->

                <div class="bottom">


                    <button
                        class="run"
                        onclick="runCode()"
                    >
                        ▶ Run
                    </button>


                    <button
                        class="clear"
                        onclick="clearCode()"
                    >
                        Clear
                    </button>


                    <div
                        class="status"
                        id="status"
                    >
                        Ready
                    </div>


                </div>

            </div>



            <!-- =================================================
                 PREVIEW
            ================================================== -->

            <div class="preview">


                <div class="preview-title">
                    Preview
                </div>


                <iframe
                    id="output"
                    title="Code Preview"
                ></iframe>


            </div>

        </div>

    </section>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        /* =====================================================
           CODE STORAGE
        ===================================================== */

        let htmlCode = "";
        let cssCode = "";
        let jsCode = "";

        let currentTab = "html";



        /* =====================================================
           ENTER CODING PORTAL
        ===================================================== */

        function enterPortal() {

            const studentName =
                document
                    .getElementById("studentInput")
                    .value
                    .trim();


            const message =
                document.getElementById("loginMessage");


            /* Check if name is empty */

            if (studentName === "") {

                message.innerText =
                    "Please enter your name first.";

                return;
            }


            /* Show student name */

            document.getElementById(
                "displayStudentName"
            ).innerText = studentName;


            /* Hide login */

            document.getElementById(
                "loginScreen"
            ).style.display = "none";


            /* Show coding studio */

            document.getElementById(
                "codingStudio"
            ).style.display = "block";


            /* Focus editor */

            document.getElementById(
                "code"
            ).focus();

        }



        /* =====================================================
           ENTER KEY
        ===================================================== */

        document
            .getElementById("studentInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        enterPortal();

                    }

                }
            );



        /* =====================================================
           CHANGE TAB
        ===================================================== */

        function openTab(tab, selectedTab) {

            saveCode();


            currentTab = tab;


            /* HTML */

            if (tab === "html") {

                document.getElementById(
                    "code"
                ).value = htmlCode;

            }


            /* CSS */

            if (tab === "css") {

                document.getElementById(
                    "code"
                ).value = cssCode;

            }


            /* JavaScript */

            if (tab === "js") {

                document.getElementById(
                    "code"
                ).value = jsCode;

            }


            /* Remove active tab */

            document
                .querySelectorAll(".tab")
                .forEach(function(item) {

                    item.classList.remove("active");

                });


            /* Activate selected tab */

            selectedTab.classList.add("active");


            updateNumbers();

        }



        /* =====================================================
           SAVE CODE
        ===================================================== */

        function saveCode() {

            const code =
                document.getElementById("code").value;


            if (currentTab === "html") {

                htmlCode = code;

            }


            if (currentTab === "css") {

                cssCode = code;

            }


            if (currentTab === "js") {

                jsCode = code;

            }

        }



        /* =====================================================
           RUN CODE
        ===================================================== */

        function runCode() {

            saveCode();


            const result = `

<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <style>

        ${cssCode}

    </style>

</head>


<body>

    ${htmlCode}


    <script>

        ${jsCode}

    <\/script>

</body>

</html>

            `;


            document.getElementById(
                "output"
            ).srcdoc = result;


            document.getElementById(
                "status"
            ).innerText = "Running";

        }



        /* =====================================================
           CLEAR CODE
        ===================================================== */

        function clearCode() {

            htmlCode = "";
            cssCode = "";
            jsCode = "";


            document.getElementById(
                "code"
            ).value = "";


            document.getElementById(
                "output"
            ).srcdoc = "";


            document.getElementById(
                "status"
            ).innerText = "Ready";


            updateNumbers();

        }



        /* =====================================================
           LINE NUMBERS
        ===================================================== */

        function updateNumbers() {

            const lines =
                document
                    .getElementById("code")
                    .value
                    .split("\n")
                    .length;


            let numbers = "";


            for (
                let i = 1;
                i <= lines;
                i++
            ) {

                numbers += i + "<br>";

            }


            document.getElementById(
                "numbers"
            ).innerHTML = numbers;

        }



        /* =====================================================
           UPDATE LINE NUMBERS WHILE TYPING
        ===================================================== */

        document
            .getElementById("code")
            .addEventListener(
                "input",
                updateNumbers
            );


    </script>

</body>
</html>
